<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">LCM</div>
    <p class="eyebrow">Gestión integral</p>
    <h1 id="login-title">La Casa del Material</h1>
    <p class="intro">Accede al panel de administración del depósito.</p>

    <form>
      <label for="email">Usuario</label>
      <input id="email" name="email" type="email" placeholder="administrador@lcm.local" autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">

      <a class="primary-button" routerLink="/dashboard">Ingresar</a>
    </form>
    <small>Acceso visual de demostración · Autenticación pendiente</small>
  </section>
</main>
